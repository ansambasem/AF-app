name: Read cPanel deploy log (temporary)

on:
  push:
    branches:
      - claude/read-cpanel-log

permissions:
  contents: read

env:
  CPANEL_HOST: abuzaed.ps
  CPANEL_USER: abuzaedp

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read the last deploy log and the voucher cleanup files
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          api() {
            curl -sS --max-time 120 \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/$1" "${@:2}"
          }
          read_file() {
            echo "===== $1/$2 ====="
            api Fileman/get_file_content --data-urlencode "dir=$1" --data-urlencode "file=$2" \
              | jq -r 'if .status == 1 then .data.content else "ERROR: \(.errors)" end' | tail -n "${3:-200}"
          }
          d=/home/abuzaedp/powercollect/storage/app/private/voucher-cleanup/2026-11-10_075351
          api Fileman/list_files --data-urlencode "dir=$d" | jq -r '.data[] | "\(.file) \(.size)"'
          api Fileman/get_file_content --data-urlencode "dir=$d" --data-urlencode "file=deleted-rows.json" | jq -r '.data.content' \
            | jq -c '.[] | {voucher, kept, transactions: [.transactions[] | {id, subscription_id, type, amount, payment_method, manual_voucher_number, status, created_at}], box_entries: [.cash_box_payments[] | {id, amount, status}], closing_rows: (.closing_payments|length), amendments: (.transaction_amendments|length), bank_audits: (.bank_transfer_audits|length), notes_unlinked: .audit_notes_unlinked}'
